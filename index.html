<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#193d34"><meta name="description" content="空氣守護隊：六個 3D 小任務，認識一氧化碳、二氧化硫、氮氧化物及懸浮粒子的影響。"><title>Air Defenders · 3D Lab</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./" aria-label="Air Defenders home"><span class="brand-icon">✳</span><span><span id="brandName">Air Defenders</span><small>AIR DEFENDERS / 3D LAB</small></span></a><nav><button id="guide" class="quiet">Field notes</button><button id="lang" class="language">繁中</button></nav></header>
<main><section class="intro" aria-label="Mission progress"><aside class="status"><div class="stats"><div><strong id="missionCount">0<span>/6</span></strong><small id="progressLabel">Missions</small></div><div><strong>4</strong><small id="pollutantLabel">Pollutants</small></div></div><div class="progress"><div id="progressFill"></div></div></aside></section>
<section class="game-grid"><div class="world"><div class="world-top"><span class="world-label" id="worldLabel">01 / CITY EXPLORATION</span><span class="scene-tag" id="sceneTag">LIVE 3D</span></div><div id="viewport" tabindex="0" role="img" aria-label="Interactive 3D model; use the station buttons below to explore"><div id="sceneFallback" hidden></div></div><div class="scene-caption" id="sceneCaption"><strong>One city. Four secrets in the air.</strong><span>Select a glowing station to meet a pollutant.</span></div><div class="world-bottom"><span id="dragHint">↔ Drag to orbit · Scroll to zoom</span><div class="scene-controls"><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomIn" aria-label="Zoom in">＋</button><button id="resetView" aria-label="Reset view">↺</button><button id="motion" aria-label="Pause animation">Ⅱ</button></div></div></div><aside class="mission-panel" id="panel" aria-live="polite"></aside></section>
<section class="station-section"><div class="section-label"><h2 id="stationsTitle">Your four exploration stations</h2></div><div class="stations" id="stations"></div></section>
</main>
<dialog id="guideDialog"><div class="dialog-head"><div><div class="eyebrow">FIELD NOTES</div><h2 id="guideTitle">Air pollution field notes</h2></div><button id="closeGuide" class="quiet" aria-label="Close">✕</button></div><div id="guideContent"></div></dialog><script type="module" src="app.js"></script></body></html>
